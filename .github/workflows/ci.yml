name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU dependencies
        # Only the CPU-only deps: micrograd & minigrad run; tritongrad, cudagrad,
        # and mlxgrad skip cleanly (no CUDA GPU, no triton/mlx installed). We do
        # NOT `pip install -r requirements.txt` because mlx has no Linux wheel and
        # triton is unnecessary on a CPU runner. torch's default PyPI build is CPU
        # on Linux, which is exactly what we want.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib pytest torch

      - name: Run tests
        run: python -m pytest tests/ -v
